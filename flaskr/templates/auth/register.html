{% extends 'base.html' %}

{% block header %}
  <h1 class="h3 mb-0">{% block title %}Register{% endblock %}</h1>
{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input class="form-control" name="username" id="username"
                     value="{{ request.form.get('username', '') }}" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input class="form-control" type="password" name="password" id="password" required>
            </div>
            <div class="mb-3">
              <label for="avatar" class="form-label">Foto de perfil (opcional)</label>
              <input class="form-control" type="file" name="avatar" id="avatar" accept="image/*">
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
