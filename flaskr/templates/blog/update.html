{% extends 'base.html' %}

{% block header %}
  <h1 class="h3 mb-0">{% block title %}Edit "{{ post.title }}"{% endblock %}</h1>
{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input class="form-control" name="title" id="title"
                     value="{{ request.form.get('title') or post.title }}" required>
            </div>
            <div class="mb-3">
              <label for="body" class="form-label">Body</label>
              <textarea class="form-control" name="body" id="body" rows="6">{{ request.form.get('body') or post.body }}</textarea>
            </div>
            <div class="mb-3">
              <label for="imagem_post" class="form-label">Imagem</label>
              {% if post.imagem_post %}
                <div class="mb-2">
                  <img src="{{ url_for('static', filename='uploads/' ~ post.imagem_post) }}"
                       alt="Imagem atual" class="img-thumbnail" style="max-height: 150px;">
                  <div class="form-text">Envie outra imagem só se quiser trocar a atual.</div>
                </div>
              {% endif %}
              <input class="form-control" type="file" name="imagem_post" id="imagem_post" accept="image/*">
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Save</button>
              <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Cancelar</a>
            </div>
          </form>

          <hr>

          <form action="{{ url_for('blog.delete', id=post.id) }}" method="post">
            <button type="submit" class="btn btn-danger"
                    onclick="return confirm('Are you sure?');">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
