{% extends 'base.html' %}

{% block header %}
  <h1 class="h3 mb-0">{% block title %}New Post{% endblock %}</h1>
{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input class="form-control" name="title" id="title"
                     value="{{ request.form.get('title', '') }}" required>
            </div>
            <div class="mb-3">
              <label for="body" class="form-label">Body</label>
              <textarea class="form-control" name="body" id="body" rows="6">{{ request.form.get('body', '') }}</textarea>
            </div>
            <div class="mb-3">
              <label for="imagem_post" class="form-label">Imagem (opcional)</label>
              <input class="form-control" type="file" name="imagem_post" id="imagem_post" accept="image/*">
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Save</button>
              <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
